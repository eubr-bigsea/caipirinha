[project]
name = "caipirinha"
version = "2.4.0"
description = "Visualization service for Lemonade"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "flask==2.2.5",
    "flask-babel==2.0.0",
    "flask-cors==3.0.10",
    "flask-migrate==3.0.1",
    "flask-restful==0.3.9",
    "flask-script==2.0.6",
    "flask-sqlalchemy==2.5.1",
    "gunicorn==21.2.0",
    "marshmallow==3.12.1",
    "psycopg2-binary==2.8.6",
    "pyaml==20.4.0",
    "pymysql==1.0.2",
    "pytest==6.2.4",
    "python-dotenv==1.0.1",
    "sqlalchemy==1.4.18",
    "sqlalchemy-i18n==1.1.0",
    "werkzeug==2.3.7",
]

[dependency-groups]
dev = [
    "coverage==5.5",
    "pytest>=6.2.4",
]
